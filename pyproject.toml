[project]
name = "financial-doc-intelligence-backend"
version = "0.1.0"
description = "Developer 2 — Backend, Database & API Architect"
requires-python = ">=3.11,<3.13"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
skip = ["alembic/versions"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E501"]
exclude = [".git", "__pycache__", ".venv", "alembic/versions"]
per-file-ignores = ["__init__.py:F401", "tests/*:S101"]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "slowapi.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "unit: Unit tests (fast, no DB)",
    "integration: Integration tests (DB required)",
    "slow: Slow tests (> 1s)",
    "smoke: Critical path smoke tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*", "*/__init__.py", "*/stubs.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"