name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy

      - name: Check Formatting with Black
        run: black --check app/ tests/

      - name: Lint with Flake8
        run: flake8 app/ tests/ --max-line-length=120 --extend-ignore=E203,W503,F401,F841

      - name: Type Check with Mypy
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  test:
    name: Automated Pytest Suite
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_financial_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_financial_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Backend Integration & Analytics Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_financial_intelligence
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_financial_intelligence
          OPENAI_API_KEY: sk-dummy-ci-test-key
        run: |
          pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: fdi-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: fdi-frontend:ci-test
